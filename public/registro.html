<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro de Estudiante - UniEmpleos</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .form-container {
            max-width: 650px;
            margin: 2rem auto;
            background: #fff;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        .form-group { margin-bottom: 1rem; }
        .form-group label { display: block; font-weight: 600; margin-bottom: 0.4rem; }
        .form-group input, .form-group textarea {
            width: 100%; padding: 0.65rem; border: 1px solid #cbd5e1; border-radius: 6px;
        }
        .redes-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0.5rem; }
        .btn-submit {
            width: 100%; padding: 0.85rem; background: #2563eb; color: #fff;
            border: none; border-radius: 6px; font-size: 1rem; font-weight: 600; cursor: pointer;
        }
        .mensaje { margin-top: 1rem; font-weight: 600; text-align: center; }
    </style>
</head>
<body>
    <header class="navbar">
        <h1>Alta de Perfil Universitario</h1>
    </header>

    <div class="form-container">
        <!-- enctype="multipart/form-data" es indispensable para enviar archivos -->
        <form id="formEstudiante" enctype="multipart/form-data">
            <div class="form-group">
                <label>Nombre y Apellido *</label>
                <input type="text" name="nombre_completo" required>
            </div>

            <div class="form-group">
                <label>Institución / Universidad *</label>
                <input type="text" name="institucion" placeholder="Ej. Universidad Gastón Dachary / UNaM" required>
            </div>

            <div class="form-group">
                <label>Carrera *</label>
                <input type="text" name="carrera" placeholder="Ej. Ingeniería Informática" required>
            </div>

            <div class="form-group">
                <label>Dirección *</label>
                <input type="text" name="direccion" required>
            </div>

            <div class="form-group">
                <label>Email *</label>
                <input type="email" name="email" required>
            </div>

            <div class="form-group">
                <label>Teléfono *</label>
                <input type="tel" name="telefono" required>
            </div>

            <div class="form-group">
                <label>Redes Sociales (Opcionales)</label>
                <div class="redes-grid">
                    <input type="url" name="linkedin_url" placeholder="URL de LinkedIn">
                    <input type="url" name="github_portfolio_url" placeholder="GitHub / Portfolio">
                    <input type="url" name="instagram_url" placeholder="Instagram">
                </div>
            </div>

            <div class="form-group">
                <label>Descripción / Perfil Profesional *</label>
                <textarea name="descripcion" rows="4" placeholder="Contá brevemente sobre vos, tus habilidades y qué tipo de puesto buscás..." required></textarea>
            </div>

            <hr style="margin: 1.5rem 0; border: 0; border-top: 1px solid #e2e8f0;">

            <div class="form-group">
                <label>Foto de Perfil (Solo .JPG o .PNG) *</label>
                <input type="file" name="foto_perfil" accept=".jpg,.jpeg,.png" required>
            </div>

            <div class="form-group">
                <label>Curriculum Vitae (Solo .PDF) *</label>
                <input type="file" name="cv_pdf" accept=".pdf" required>
            </div>

            <div class="form-group">
                <label>Certificado de Alumno Regular (Cualquier formato) *</label>
                <input type="file" name="certificado_regular" required>
            </div>

            <button type="submit" class="btn-submit">Guardar Perfil</button>
            <p id="mensajeEstado" class="mensaje"></p>
        </form>
    </div>

    <script>
        const form = document.getElementById('formEstudiante');
        const mensajeEstado = document.getElementById('mensajeEstado');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            mensajeEstado.textContent = 'Subiendo archivos y guardando datos...';
            mensajeEstado.style.color = '#334155';

            // FormData empaqueta automáticamente todos los textos y los 3 archivos
            const formData = new FormData(form);

            try {
                const res = await fetch('/api/estudiantes', {
                    method: 'POST',
                    body: formData
                });
                const data = await res.json();

                if (res.ok) {
                    mensajeEstado.style.color = '#16a34a';
                    mensajeEstado.textContent = '¡Perfil guardado con éxito!';
                    form.reset();
                } else {
                    mensajeEstado.style.color = '#dc2626';
                    mensajeEstado.textContent = data.error || 'Ocurrió un error.';
                }
            } catch (error) {
                mensajeEstado.style.color = '#dc2626';
                mensajeEstado.textContent = 'Error de conexión con el servidor.';
            }
        });
    </script>
</body>
</html>
